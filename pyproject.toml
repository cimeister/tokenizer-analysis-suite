[project]
name = "tokenizer-intrinsic-evals"
version = "1.0.3"
description = "Comprehensive tokenizer analysis framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Clara Meister" },
]
# Floors were verified against each package's source at the pinned tag; ceilings
# bound the majors this release has actually been run against (see CHANGELOG).
# Without ceilings a published wheel follows every future major forward untested.
dependencies = [
    "matplotlib>=3.9.0,<4",              # 3.3.0 predates the numpy 2.0 ABI change by four years
    "numpy>=1.20.0,<3",                  # no removed-2.0 API used below the floor
    "pandas>=1.3.0,<4",                  # read_parquet and select_dtypes both present at 1.3.0
    "scipy>=1.9.0,<2",                   # 1.9.0 added scipy.stats lazy submodule loading
    "seaborn>=0.11.0,<1",
    "tokenizers>=0.13.0,<1",             # from_file, encode_batch, ByteLevel(use_regex=) at 0.13.0
    "tiktoken>=0.5.0,<1",
    "transformers>=4.20.0,<6",           # PreTrainedTokenizerFast and trust_remote_code at 4.20.0
    "tree-sitter-language-pack>=0.13.0,<1",
]
# CI (.github/workflows/ci.yml) covers 3.10, 3.12 and 3.13 on Linux only; the
# classifiers below list only what is actually tested.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/cimeister/tokenizer-intrinsic-evals"

[project.scripts]
tokenizer-analysis = "tokenizer_analysis.cli.run_analysis:main"
tokenizer-visualize = "tokenizer_analysis.cli.visualize_tokenization:main"
tokenizer-sanity-check = "tokenizer_analysis.cli.sanity_check:main"

[project.optional-dependencies]
# Parquet code-corpus reading (pandas picks whichever engine is installed).
# pyarrow only: fastparquet is being retired and pandas 3.1 deprecates that engine.
parquet = [
    "pyarrow>=10.0.0",
]

# SentencePiece model files (the `sentencepiece` tokenizer class). The wrapper
# imports it lazily and raises with this install line when it is absent, so the
# rest of the package works without it. Floor is the release the 1.0 tests were
# run against; the wrapper also probes the older IsControl/IsUnknown spelling,
# so earlier releases may work but were not tested.
sentencepiece = [
    "sentencepiece>=0.2.0,<1",
]

# Fetching the FLORES+ evaluation corpus with scripts/fetch_flores.py. Only the
# fetch needs it; the library reads the .txt files the script writes.
flores = [
    "datasets>=2.14.0",
]

[dependency-groups]
dev = [
    "sentencepiece>=0.2.0,<1",   # so the SentencePieceTokenizer tests run rather than skip
    "pytest>=6.0",
]

[build-system]
# 1.26 is the floor that added the PEP 639 license-expression and license-files
# fields used above; both are required by this file's `license` and
# `license-files` keys.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenizer_analysis"]
# Tests are not part of the installed library.
exclude = ["tokenizer_analysis/tests"]
